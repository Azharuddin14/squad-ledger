<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Pitchside — Tournament Manager</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1B4332" />
<link rel="apple-touch-icon" href="icon-192.png" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  #boot-status { font-family: sans-serif; color: #F5EFDC; background:#0F2C22; min-height:100vh;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
</style>
</head>
<body>
<div id="root"><div id="boot-status">Loading Pitchside…</div></div>
<script>
  window.addEventListener("error", function (e) {
    var el = document.getElementById("boot-status");
    if (el) el.innerText = "Something failed to load (" + e.message + "). Check your connection and reload.";
  }, true);
</script>
<script>
// ============================================================
// Pitchside — data model helpers
// ============================================================
let uidCounter = 1;
const uid = (p = "id") => `${p}-${Date.now().toString(36)}-${uidCounter++}`;
const PALETTE = ["#1B4332", "#0B3D91", "#7A1E1E", "#013220", "#2A0944", "#062A38", "#3D0000", "#0D2C54", "#264653", "#3A0CA3"];
function getTeam(teams, id) {
  return teams.find(t => t.id === id) || null;
}
function teamName(teams, id) {
  const t = getTeam(teams, id);
  return t ? t.name : "TBD";
}
function blankScore() {
  return {
    runs: "",
    wkts: "",
    overs: "",
    allOut: false
  };
}
function blankMatch(team1Id = null, team2Id = null) {
  return {
    id: uid("m"),
    team1Id,
    team2Id,
    battingFirstId: team1Id,
    score1: blankScore(),
    score2: blankScore(),
    mom: "",
    tieWinnerId: null,
    date: ""
  };
}
function isPlayed(match) {
  return match.score1.runs !== "" && match.score2.runs !== "" && match.score1.runs != null && match.score2.runs != null;
}

// cricket overs notation "6.2" means 6 overs + 2 balls = 6 + 2/6 actual overs (not decimal 6.2)
function oversToDecimal(overStr) {
  if (overStr === "" || overStr === null || overStr === undefined) return 0;
  const s = String(overStr);
  const [whole, ballPart] = s.split(".");
  const w = parseInt(whole || "0", 10) || 0;
  let b = parseInt(ballPart || "0", 10) || 0;
  if (b > 5) b = 5; // guard against invalid entry
  return w + b / 6;
}

// overs actually faced by a side, for NRR purposes
function oversForNRR(score, matchOvers) {
  if (score.allOut) return matchOvers;
  if (score.overs === "" || score.overs === null || score.overs === undefined) return matchOvers;
  const n = oversToDecimal(score.overs);
  return n > 0 ? Math.min(n, matchOvers) : matchOvers;
}
function formatOvers(o) {
  const n = Number(o);
  if (!isFinite(n)) return String(o);
  return Number.isInteger(n) ? String(n) : String(n);
}

// "143" if all out, "185/4" if full quota not out, "54/1(6.2)" if finished early (successful chase)
function formatScore(score, matchOvers) {
  if (score.runs === "" || score.runs === null || score.runs === undefined) return "-";
  if (score.allOut) return `${score.runs}`;
  const overs = oversForNRR(score, matchOvers);
  const wkts = score.wkts === "" || score.wkts === null || score.wkts === undefined ? 0 : score.wkts;
  if (overs >= matchOvers) return `${score.runs}/${wkts}`;
  return `${score.runs}/${wkts}(${formatOvers(score.overs)})`;
}

// winner derivation: higher runs wins; equal runs => tie unless a tie-break winner was chosen
function getWinnerId(match) {
  if (!isPlayed(match)) return null;
  const r1 = Number(match.score1.runs);
  const r2 = Number(match.score2.runs);
  if (r1 === r2) return match.tieWinnerId || null;
  return r1 > r2 ? match.team1Id : match.team2Id;
}
function isTied(match) {
  return isPlayed(match) && Number(match.score1.runs) === Number(match.score2.runs) && !match.tieWinnerId;
}

// margin text e.g. "won by 69 runs" / "won by 6 wickets"
function marginText(match, teams, matchOvers) {
  if (!isPlayed(match)) return null;
  const winnerId = getWinnerId(match);
  if (!winnerId) return "Match tied";
  const firstId = match.battingFirstId || match.team1Id;
  const secondId = firstId === match.team1Id ? match.team2Id : match.team1Id;
  const firstScore = firstId === match.team1Id ? match.score1 : match.score2;
  const secondScore = firstId === match.team1Id ? match.score2 : match.score1;
  const firstRuns = Number(firstScore.runs);
  const secondRuns = Number(secondScore.runs);
  if (winnerId === firstId) {
    const margin = firstRuns - secondRuns;
    return `${teamName(teams, winnerId)} won by ${margin} run${margin === 1 ? "" : "s"}`;
  }
  const secondWkts = secondScore.allOut ? 10 : Number(secondScore.wkts) || 0;
  const wicketsRemaining = Math.max(0, 10 - secondWkts);
  return `${teamName(teams, winnerId)} won by ${wicketsRemaining} wicket${wicketsRemaining === 1 ? "" : "s"}`;
}

// the compact one-line notation the user actually writes by hand:
// "AS# 175/5 v GAW 106  Head 58(45)" — batting-first team shown first, "#" on the winner
function resultLine(match, teams, matchOvers) {
  if (!isPlayed(match)) return null;
  const firstId = match.battingFirstId || match.team1Id;
  const secondId = firstId === match.team1Id ? match.team2Id : match.team1Id;
  const firstScore = firstId === match.team1Id ? match.score1 : match.score2;
  const secondScore = firstId === match.team1Id ? match.score2 : match.score1;
  const line = `${teamName(teams, firstId)} ${formatScore(firstScore, matchOvers)} v ${teamName(teams, secondId)} ${formatScore(secondScore, matchOvers)}`;
  return match.mom ? `${line}  ${match.mom}` : line;
}

// structured version of the same info, for rendering with team-color badges
// instead of a plain string (used wherever a match result appears visually)
function getMatchDisplay(match, teams, matchOvers) {
  if (!isPlayed(match)) return null;
  const firstId = match.battingFirstId || match.team1Id;
  const secondId = firstId === match.team1Id ? match.team2Id : match.team1Id;
  const firstScore = firstId === match.team1Id ? match.score1 : match.score2;
  const secondScore = firstId === match.team1Id ? match.score2 : match.score1;
  return {
    firstTeam: getTeam(teams, firstId),
    secondTeam: getTeam(teams, secondId),
    firstScoreText: formatScore(firstScore, matchOvers),
    secondScoreText: formatScore(secondScore, matchOvers),
    margin: marginText(match, teams, matchOvers),
    mom: match.mom || null
  };
}
function computeStandings(teamIds, matches, matchOvers) {
  const stats = {};
  teamIds.forEach(id => {
    stats[id] = {
      id,
      played: 0,
      won: 0,
      lost: 0,
      tied: 0,
      points: 0,
      runsFor: 0,
      oversFor: 0,
      runsAgainst: 0,
      oversAgainst: 0
    };
  });
  matches.forEach(m => {
    if (!isPlayed(m)) return;
    const s1 = stats[m.team1Id];
    const s2 = stats[m.team2Id];
    if (!s1 || !s2) return;
    s1.played++;
    s2.played++;
    const o1 = oversForNRR(m.score1, matchOvers);
    const o2 = oversForNRR(m.score2, matchOvers);
    s1.runsFor += Number(m.score1.runs) || 0;
    s1.oversFor += o1;
    s1.runsAgainst += Number(m.score2.runs) || 0;
    s1.oversAgainst += o2;
    s2.runsFor += Number(m.score2.runs) || 0;
    s2.oversFor += o2;
    s2.runsAgainst += Number(m.score1.runs) || 0;
    s2.oversAgainst += o1;
    const winnerId = getWinnerId(m);
    if (!winnerId) {
      s1.tied++;
      s2.tied++;
      s1.points += 1;
      s2.points += 1;
    } else if (winnerId === m.team1Id) {
      s1.won++;
      s2.lost++;
      s1.points += 2;
    } else {
      s2.won++;
      s1.lost++;
      s2.points += 2;
    }
  });
  const rows = Object.values(stats).map(s => {
    const forRate = s.oversFor > 0 ? s.runsFor / s.oversFor : 0;
    const againstRate = s.oversAgainst > 0 ? s.runsAgainst / s.oversAgainst : 0;
    return {
      ...s,
      nrr: forRate - againstRate
    };
  });
  rows.sort((a, b) => b.points - a.points || b.nrr - a.nrr);
  return rows;
}
function allSeasonMatches(season) {
  const list = [];
  (season.preQualGroups || []).forEach(g => list.push(...g.matches));
  (season.groups || []).forEach(g => list.push(...g.matches));
  (season.knockoutRounds || []).forEach(r => list.push(...r.matches));
  return list;
}

// pulls the player's name out of a freeform MOM line like "Head 58(45)" or
// "Bumrah 4/25" by stripping the trailing batting/bowling figures
function extractMomName(momText) {
  if (!momText) return null;
  const trimmed = momText.trim();
  // find the FIRST batting figure "58(45)"/"81*(45)" or bowling figure "5/33"
  // anywhere in the string — everything before it is the player's name. This
  // handles all-round performances like "Andre Russell 54(42) 5/33" correctly,
  // where a naive "strip from the end" approach would leave the batting
  // figures stuck onto the name.
  const perfPattern = /\d+\*?\(\d+(?:\.\d+)?\)|\d+\/\d+/;
  const m = trimmed.match(perfPattern);
  if (!m) return trimmed;
  const name = trimmed.slice(0, m.index).trim();
  return name || trimmed;
}

// Man-of-the-Match tally for a season, sorted with the most awards first
function getMomTally(season) {
  const counts = {};
  allSeasonMatches(season).forEach(m => {
    const name = extractMomName(m.mom);
    if (!name) return;
    counts[name] = (counts[name] || 0) + 1;
  });
  return Object.entries(counts).map(([name, count]) => ({
    name,
    count
  })).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
}

// MOM tally across every saved season
function getMomTallyAllSeasons(seasons) {
  const counts = {};
  seasons.forEach(season => {
    allSeasonMatches(season).forEach(m => {
      const name = extractMomName(m.mom);
      if (!name) return;
      counts[name] = (counts[name] || 0) + 1;
    });
  });
  return Object.entries(counts).map(([name, count]) => ({
    name,
    count
  })).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
}

// pulls a batting figure like "58(45)" or "81*(45)" out of a MOM line, if present
function extractMomBatting(momText) {
  if (!momText) return null;
  const m = momText.match(/(\d+)(\*?)\((\d+)(?:\.\d+)?\)/);
  if (!m) return null;
  return {
    runs: parseInt(m[1], 10),
    balls: parseInt(m[3], 10),
    notOut: m[2] === "*"
  };
}

// pulls a bowling figure like "4/25" out of a MOM line, if present
function extractMomBowling(momText) {
  if (!momText) return null;
  const m = momText.match(/(\d+)\/(\d+)/);
  if (!m) return null;
  return {
    wickets: parseInt(m[1], 10),
    runs: parseInt(m[2], 10)
  };
}

// every completed innings across the given seasons, tagged with team/opponent/
// season/stage — the raw material for the "top scores" style records below
function getAllInnings(seasons, teamFilter) {
  const innings = [];
  seasons.forEach(season => {
    const addFrom = (matches, stage) => {
      matches.forEach(m => {
        if (!isPlayed(m)) return;
        const firstId = m.battingFirstId || m.team1Id;
        const secondId = firstId === m.team1Id ? m.team2Id : m.team1Id;
        const firstScore = firstId === m.team1Id ? m.score1 : m.score2;
        const secondScore = firstId === m.team1Id ? m.score2 : m.score1;
        const winnerId = getWinnerId(m);
        const push = (teamId, oppId, score, chasing) => {
          if (teamFilter && teamId !== teamFilter) return;
          innings.push({
            teamId,
            oppId,
            score,
            matchOvers: season.oversPerMatch,
            seasonName: season.name,
            stage,
            chasing,
            won: winnerId === teamId,
            complete: !!score.allOut || oversForNRR(score, season.oversPerMatch) >= season.oversPerMatch
          });
        };
        push(firstId, secondId, firstScore, false);
        push(secondId, firstId, secondScore, true);
      });
    };
    (season.preQualGroups || []).forEach(g => addFrom(g.matches, `Pre-Qual: ${g.name}`));
    (season.groups || []).forEach(g => addFrom(g.matches, `Group ${g.name}`));
    (season.knockoutRounds || []).forEach(r => addFrom(r.matches, r.name));
  });
  return innings;
}
function formatInningsScore(score, matchOvers) {
  return formatScore(score, matchOvers);
}

// top N highest completed innings totals (excludes innings cut short by a
// successful chase, since those don't reflect the team's actual ceiling)
function getTopScores(seasons, n, teamFilter) {
  return getAllInnings(seasons, teamFilter).filter(i => i.complete).sort((a, b) => Number(b.score.runs) - Number(a.score.runs)).slice(0, n);
}

// lowest N completed innings totals, same exclusion as above
function getLowScores(seasons, n, teamFilter) {
  return getAllInnings(seasons, teamFilter).filter(i => i.complete).sort((a, b) => Number(a.score.runs) - Number(b.score.runs)).slice(0, n);
}

// top N successful run chases, ranked by the size of the target actually chased down
function getTopChases(seasons, n, teamFilter) {
  return getAllInnings(seasons, teamFilter).filter(i => i.chasing && i.won).sort((a, b) => Number(b.score.runs) - Number(a.score.runs)).slice(0, n);
}

// top N individual batting performances pulled out of MOM entries
// top N individual batting performances pulled out of MOM entries — MOM always
// belongs to a player on the winning side, so each performance is attributed
// to whichever team actually won that match
function getTopMomBatting(seasons, n, teamFilter) {
  const rows = [];
  seasons.forEach(season => {
    const addFrom = (matches, stage) => {
      matches.forEach(m => {
        if (!isPlayed(m) || !m.mom) return;
        const winnerId = getWinnerId(m);
        if (!winnerId) return; // tie — can't attribute to a side
        if (teamFilter && winnerId !== teamFilter) return;
        const bat = extractMomBatting(m.mom);
        if (!bat) return;
        const name = extractMomName(m.mom);
        rows.push({
          name,
          teamId: winnerId,
          runs: bat.runs,
          balls: bat.balls,
          notOut: bat.notOut,
          seasonName: season.name,
          stage
        });
      });
    };
    (season.preQualGroups || []).forEach(g => addFrom(g.matches, `Pre-Qual: ${g.name}`));
    (season.groups || []).forEach(g => addFrom(g.matches, `Group ${g.name}`));
    (season.knockoutRounds || []).forEach(r => addFrom(r.matches, r.name));
  });
  return rows.sort((a, b) => b.runs - a.runs).slice(0, n);
}

// top N individual bowling performances pulled out of MOM entries
function getTopMomBowling(seasons, n, teamFilter) {
  const rows = [];
  seasons.forEach(season => {
    const addFrom = (matches, stage) => {
      matches.forEach(m => {
        if (!isPlayed(m) || !m.mom) return;
        const winnerId = getWinnerId(m);
        if (!winnerId) return;
        if (teamFilter && winnerId !== teamFilter) return;
        const bowl = extractMomBowling(m.mom);
        if (!bowl) return;
        const name = extractMomName(m.mom);
        rows.push({
          name,
          teamId: winnerId,
          wickets: bowl.wickets,
          runs: bowl.runs,
          seasonName: season.name,
          stage
        });
      });
    };
    (season.preQualGroups || []).forEach(g => addFrom(g.matches, `Pre-Qual: ${g.name}`));
    (season.groups || []).forEach(g => addFrom(g.matches, `Group ${g.name}`));
    (season.knockoutRounds || []).forEach(r => addFrom(r.matches, r.name));
  });
  return rows.sort((a, b) => b.wickets - a.wickets || a.runs - b.runs).slice(0, n);
}

// champion / runner-up / semi-finalists for a season, derived from the (user-named,
// user-ordered) knockout rounds — last round is the Final, one before it the Semis
function getChampionInfo(season) {
  const rounds = season.knockoutRounds || [];
  if (!rounds.length) return null;
  const finalRound = rounds[rounds.length - 1];
  const finalMatch = finalRound.matches[0];
  if (!finalMatch || !isPlayed(finalMatch)) return null;
  const winnerId = getWinnerId(finalMatch);
  if (!winnerId) return null;
  const runnerUpId = winnerId === finalMatch.team1Id ? finalMatch.team2Id : finalMatch.team1Id;
  const semiRound = rounds.length >= 2 ? rounds[rounds.length - 2] : null;
  const semiFinalists = semiRound ? semiRound.matches.map(m => {
    const w = getWinnerId(m);
    if (!w) return null;
    return w === m.team1Id ? m.team2Id : m.team1Id;
  }).filter(Boolean) : [];
  return {
    championId: winnerId,
    runnerUpId,
    semiFinalists,
    finalRoundName: finalRound.name
  };
}

// did this team play in the semi-final round (second-to-last knockout round)
// this season, regardless of naming ("Semis", "Semi-Final", etc.) or outcome?
function reachedSemis(season, teamId) {
  const rounds = season.knockoutRounds || [];
  if (rounds.length < 2) return false;
  const semiRound = rounds[rounds.length - 2];
  return semiRound.matches.some(m => m.team1Id === teamId || m.team2Id === teamId);
}

// career totals used for sorting/ranking teams across every saved season
function getOverallStageCounts(seasons, teamId) {
  let championships = 0,
    runnerUps = 0,
    semis = 0;
  seasons.forEach(season => {
    const info = getChampionInfo(season);
    if (info) {
      if (info.championId === teamId) championships++;
      if (info.runnerUpId === teamId) runnerUps++;
    }
    if (reachedSemis(season, teamId)) semis++;
  });
  return {
    championships,
    runnerUps,
    semis
  };
}

// the furthest stage a team reached in a season's knockouts (rounds are plain,
// user-named, in order — no bracket math needed)
function getStageReached(season, teamId) {
  const rounds = season.knockoutRounds || [];
  for (let i = rounds.length - 1; i >= 0; i--) {
    const round = rounds[i];
    const match = round.matches.find(m => m.team1Id === teamId || m.team2Id === teamId);
    if (!match) continue;
    const isFinal = i === rounds.length - 1;
    if (!isPlayed(match)) return `In ${round.name}`;
    const winnerId = getWinnerId(match);
    if (!winnerId) return `In ${round.name} (tied)`;
    if (winnerId === teamId) return isFinal ? "Winner" : `Reached ${round.name}`;
    return isFinal ? "Runner-up" : round.name;
  }
  const inGroup = (season.groups || []).some(g => g.teamIds.includes(teamId));
  if (inGroup) return "Group stage";
  const inPreQual = (season.preQualGroups || []).some(g => g.teamIds.includes(teamId));
  if (inPreQual) return "Pre-Quals";
  return "Did not play";
}

// per-season highest-stage results, bucketed into the 5 categories shown on a
// team's profile: Championships / Runner-ups / Semis / Group Stage / Pre-Quals
function getStageBreakdown(seasons, teamId) {
  let championships = 0,
    runnerUps = 0,
    semis = 0,
    quarterFinals = 0,
    groupStage = 0,
    preQuals = 0;
  seasons.forEach(season => {
    const rounds = season.knockoutRounds || [];
    let found = false;
    for (let i = rounds.length - 1; i >= 0 && !found; i--) {
      const round = rounds[i];
      const match = round.matches.find(m => m.team1Id === teamId || m.team2Id === teamId);
      if (!match) continue;
      found = true;
      if (!isPlayed(match)) break; // in progress — don't count towards a finished result yet
      const winnerId = getWinnerId(match);
      if (!winnerId) break; // tied with no resolution
      const isFinal = i === rounds.length - 1;
      if (winnerId === teamId) {
        if (isFinal) championships++;
        // else: shouldn't happen — a round winner would appear in the next round too,
        // which the reverse loop would have already matched first
      } else if (isFinal) {
        runnerUps++;
      } else if (i === rounds.length - 2) {
        semis++; // lost in the actual semi-final round
      } else {
        quarterFinals++; // lost any earlier round
      }
    }
    if (found) return;
    if ((season.groups || []).some(g => g.teamIds.includes(teamId))) {
      groupStage++;
      return;
    }
    if ((season.preQualGroups || []).some(g => g.teamIds.includes(teamId))) preQuals++;
  });
  return {
    championships,
    runnerUps,
    semis,
    quarterFinals,
    groupStage,
    preQuals
  };
}
function getTeamRecordInSeason(season, teamId) {
  const inSeason = (season.groups || []).some(g => g.teamIds.includes(teamId)) || (season.preQualGroups || []).some(g => g.teamIds.includes(teamId)) || allSeasonMatches(season).some(m => m.team1Id === teamId || m.team2Id === teamId);
  if (!inSeason) return null;
  let played = 0,
    won = 0,
    lost = 0,
    tied = 0;
  allSeasonMatches(season).forEach(m => {
    if (m.team1Id !== teamId && m.team2Id !== teamId) return;
    if (!isPlayed(m)) return;
    played++;
    const w = getWinnerId(m);
    if (!w) tied++;else if (w === teamId) won++;else lost++;
  });
  return {
    seasonName: season.name,
    played,
    won,
    lost,
    tied,
    stage: getStageReached(season, teamId)
  };
}

// overall record + opponent-wise head-to-head, across every saved season
function computeRecordAndH2H(matches, teamId) {
  let played = 0,
    won = 0,
    lost = 0,
    tied = 0;
  const h2h = {};
  matches.forEach(m => {
    if (m.team1Id !== teamId && m.team2Id !== teamId) return;
    if (!isPlayed(m)) return;
    const oppId = m.team1Id === teamId ? m.team2Id : m.team1Id;
    if (!oppId) return;
    if (!h2h[oppId]) h2h[oppId] = {
      id: oppId,
      played: 0,
      won: 0,
      lost: 0,
      tied: 0
    };
    played++;
    h2h[oppId].played++;
    const w = getWinnerId(m);
    if (!w) {
      tied++;
      h2h[oppId].tied++;
    } else if (w === teamId) {
      won++;
      h2h[oppId].won++;
    } else {
      lost++;
      h2h[oppId].lost++;
    }
  });
  const headToHead = Object.values(h2h).sort((a, b) => b.played - a.played || b.won - a.won);
  return {
    played,
    won,
    lost,
    tied,
    headToHead
  };
}

// overall record + opponent-wise head-to-head, across every saved season, every stage
function getOverallAndH2H(seasons, teamId) {
  const matches = [];
  seasons.forEach(season => matches.push(...allSeasonMatches(season)));
  return computeRecordAndH2H(matches, teamId);
}

// same, but counting only knockout-stage matches (Pre-Quals/Groups excluded)
function getKnockoutH2H(seasons, teamId) {
  const matches = [];
